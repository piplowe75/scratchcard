<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scratchcard</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efeaf8; --bg2:#ffe3d3; --ink:#2b1b3d; --muted:#6a5a7e; --card:#fffdfb; --accent:#7a4fd1; --line:#d9d0ea;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1b1228; --bg2:#33203a; --ink:#f4eefc; --muted:#b9a9d0; --card:#2a1d3a; --accent:#b99bff; --line:#43345a; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#1b1228; --bg2:#33203a; --ink:#f4eefc; --muted:#b9a9d0; --card:#2a1d3a; --accent:#b99bff; --line:#43345a; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 60%) fixed,var(--bg);
  display:flex;flex-direction:column;align-items:center;padding:28px 18px 40px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(1.7rem,6vw,2.4rem);margin:8px 0 6px;text-align:center;letter-spacing:-.01em}
.sub{margin:0 0 22px;color:var(--muted);text-align:center}
.card{position:relative;width:min(440px,100%);border-radius:22px;background:var(--card);
  box-shadow:0 18px 50px -18px rgba(60,30,110,.45),0 0 0 1px var(--line);overflow:hidden;user-select:none;-webkit-user-select:none}
.under{position:relative;display:flex;flex-direction:column;padding:14px;gap:12px}
.scan{aspect-ratio:900/594;border-radius:14px;overflow:hidden;background:#0d0a14}
.scan img{width:100%;height:100%;object-fit:contain;display:block}
.msg{text-align:center;padding:2px 6px 6px}
.msg h2{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:1.55rem;margin:0 0 4px}
.msg p{margin:0;color:var(--muted);line-height:1.45;font-size:.98rem}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .9s ease}
canvas.done{opacity:0;pointer-events:none}
.actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:999px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details{margin-top:26px;width:min(360px,100%);border:1px solid var(--line);border-radius:16px;background:var(--card);padding:4px 16px}
summary{cursor:pointer;padding:12px 0;font-weight:500}
.field{display:grid;gap:6px;margin:4px 0 14px}
.field label{font-size:.88rem;color:var(--muted)}
input[type=text],textarea{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=file]{font:inherit;color:var(--muted);width:100%}
@media (prefers-reduced-motion:reduce){canvas{transition:none}}
</style>
</head>
<body>

<div class="card" id="card">
  <div class="under">
    <div class="scan"><img id="scanImg" alt="Baby ultrasound scan"></div>
    <div class="msg">
      <h2 id="msgTitle">We’ve been keeping a little secret...</h2>
      <p id="msgBody">May 2027 can’t come soon enough! We’re so excited to share the news with you first.</p>
    </div>
  </div>
  <canvas id="foil" aria-label="Scratch area. Drag to reveal the announcement."></canvas>
</div>

<div class="actions">
  <button id="reveal" type="button">Reveal all</button>
  <button id="again" type="button">Scratch again</button>
</div>

  img.addEventListener('load', function(){ if(img.naturalWidth){ img.parentNode.style.aspectRatio = img.naturalWidth + '/' + img.naturalHeight; if(window.__repaint) window.__repaint(); } });

  var card = document.getElementById('card'), cv = document.getElementById('foil'), ctx = cv.getContext('2d');
  var w = 0, h = 0, dpr = 1, drawing = false, last = null, revealed = false, strokes = 0;

  function paintFoil(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = card.clientWidth; h = card.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalCompositeOperation = 'source-over';
    var g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#c9b8f0'); g.addColorStop(.3,'#f7d9c9'); g.addColorStop(.55,'#cfe3f5'); g.addColorStop(.8,'#e6c9f2'); g.addColorStop(1,'#c9b8f0');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    // fine sparkle grain
    for (var i=0;i<900;i++){
      ctx.fillStyle = 'rgba(255,255,255,' + (Math.random()*.35) + ')';
      ctx.fillRect(Math.random()*w, Math.random()*h, 1.5, 1.5);
    }
    ctx.fillStyle = 'rgba(60,35,100,.75)';
    ctx.textAlign = 'center';
    ctx.font = '500 ' + Math.round(w*.085) + 'px Fraunces, Georgia, serif';
    ctx.fillText('Scratch here', w/2, h/2 - 4);
    ctx.font = '400 ' + Math.round(w*.04) + 'px "DM Sans", sans-serif';
    ctx.fillText('use your mouse or finger', w/2, h/2 + w*.07);
    ctx.globalCompositeOperation = 'destination-out';
  }

  function pos(e){ var r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
  function scratch(a,b){
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(26, w*.1);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  function cleared(){
    var d = ctx.getImageData(0,0,cv.width,cv.height).data, n = 0, tot = 0;
    for (var i=3;i<d.length;i+=64){ tot++; if(d[i]===0) n++; }
    return n/tot;
  }
  function finish(){ if(revealed) return; revealed = true; cv.classList.add('done'); }

  cv.addEventListener('pointerdown', function(e){
    if(revealed) return; drawing = true; cv.setPointerCapture(e.pointerId);
    last = pos(e); scratch(last, {x:last.x+.1,y:last.y+.1}); e.preventDefault();
  });
  cv.addEventListener('pointermove', function(e){
    if(!drawing) return; var p = pos(e); scratch(last,p); last = p;
    if(++strokes % 8 === 0 && cleared() > .55) finish();
  });
  function up(){ drawing = false; if(!revealed && cleared() > .55) finish(); }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  document.getElementById('reveal').addEventListener('click', finish);
  document.getElementById('again').addEventListener('click', function(){
    revealed = false; strokes = 0; cv.classList.remove('done'); paintFoil();
  });
  window.__repaint = function(){ if(!revealed && strokes === 0) paintFoil(); };
  var rt; window.addEventListener('resize', function(){
    clearTimeout(rt); rt = setTimeout(function(){ if(!revealed && strokes === 0) paintFoil(); }, 150);
  });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(paintFoil);
  paintFoil();
})();
